[project]
name = "physical-ai-hack"
version = "0.1.0"
description = "Hill Climb harness around Dream-1 for the MakerMods Physical AI Hack"
authors = [
    { name = "MNS1007", email = "nithin.murugan10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
harness = "physical_ai_hack.harness:run"
convert = "physical_ai_hack.convert.cli:run"
finetune = "physical_ai_hack.finetune:run"
station-plus = "physical_ai_hack.station_plus:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
convert = [
    "av>=19.0.2",
    "dreamlabs>=1.0.37",
    "numpy>=2.2",
    "pillow>=10",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "rerun-sdk>=0.42,<0.43",
]
judge = [
    "anthropic>=1.0",
    "python-dotenv>=1.2.4",
]
livekit = [
    "faster-whisper>=1.0",
    "livekit>=1.0",
    "livekit-api>=1.0",
    "numpy>=2.2.6",
    "python-dotenv>=1.2.4",
]
