[project]
name = "physical-ai-hack"
version = "0.1.0"
description = "Hill Climb harness around Dream-1 for the MakerMods Physical AI Hack"
authors = [
    { name = "MNS1007", email = "nithin.murugan10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dreamlabs>=1.0.37",
    "numpy>=2.2.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
harness = "physical_ai_hack.live:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
live = [
    "livekit-api>=0.7",
    "livekit-portal>=0.3.0 ; sys_platform == 'linux'",
]
